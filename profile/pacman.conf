[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
Color
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
LogFile     = /var/log/pacman.log
CacheDir    = /var/cache/pacman/pkg/
NoExtract   = usr/share/man/*
NoExtract   = usr/share/info/*
NoExtract   = usr/share/doc/*
NoExtract   = usr/share/help/*
NoExtract   = usr/share/gtk-doc/*
NoExtract   = usr/share/locale/*
NoExtract   = !usr/share/locale/en*
NoExtract   = !usr/share/locale/locale.alias
NoExtract   = usr/share/i18n/*
NoExtract   = usr/share/licenses/*
# AMD-only target: strip Intel firmware and drivers from the image
NoExtract   = usr/lib/firmware/i915/*
NoExtract   = usr/lib/firmware/ice/*
NoExtract   = usr/lib/firmware/igb*
NoExtract   = usr/lib/firmware/ixgbe*
NoExtract   = usr/lib/firmware/intel/*
NoExtract   = usr/lib/firmware/iwlwifi-*
NoExtract   = usr/lib/modules/*/kernel/drivers/gpu/drm/i915/*
NoExtract   = usr/lib/modules/*/kernel/drivers/gpu/drm/xe/*
NoExtract   = usr/lib/modules/*/kernel/drivers/gpu/drm/gma500/*
NoExtract   = usr/lib/modules/*/kernel/drivers/net/ethernet/intel/*
NoExtract   = usr/lib/modules/*/kernel/drivers/net/wireless/intel/*
NoExtract   = usr/lib/modules/*/kernel/drivers/misc/mei/*
NoExtract   = usr/lib/modules/*/kernel/drivers/hid/intel-ish-hid/*
NoExtract   = usr/lib/modules/*/kernel/drivers/platform/x86/intel_*
NoExtract   = usr/lib/modules/*/kernel/drivers/platform/x86/pmc_core*
NoExtract   = usr/lib/modules/*/kernel/drivers/iio/accel/*intel*
NoExtract   = usr/lib/modules/*/kernel/drivers/iio/gyro/*intel*
NoExtract   = usr/lib/dri/*intel*
NoExtract   = usr/lib/dri/i915_dri.so
NoExtract   = usr/lib/dri/i965_dri.so
NoExtract   = usr/lib/dri/iris_dri.so
NoExtract   = usr/lib/dri/crocus_dri.so
NoExtract   = usr/lib/va/*intel*
NoExtract   = usr/share/vulkan/icd.d/intel*.json
NoExtract   = usr/share/drirc.d/*intel*

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
